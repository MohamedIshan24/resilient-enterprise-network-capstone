enable
configure terminal
hostname HQ-ACCESS-SW1
spanning-tree mode rapid-pvst
vlan 10
 name ADMINISTRATION
vlan 20
 name ENGINEERING
vlan 30
 name FINANCE
vlan 40
 name VOICE
vlan 50
 name SERVER_FARM
vlan 60
 name GUEST_WIFI
vlan 99
 name NETWORK_MANAGEMENT
vlan 999
 name NATIVE_PARKING
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40,60
ip arp inspection vlan 10,20,30,60
interface GigabitEthernet0/1
 description TRUSTED_TRUNK_TO_HQ-CORE-SW1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,99,999
 switchport mode trunk
 ip dhcp snooping trust
 ip arp inspection trust
interface range FastEthernet0/1-6
 description ADMINISTRATION_ENDPOINTS
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 5.00
interface range FastEthernet0/7-14
 description ENGINEERING_ENDPOINTS
 switchport mode access
 switchport access vlan 20
 switchport voice vlan 40
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
interface range FastEthernet0/15-18
 description FINANCE_ENDPOINTS
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
interface range FastEthernet0/19-20
 description SERVER_FARM_ENDPOINTS
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
interface range FastEthernet0/21-22
 description GUEST_WIRELESS_ACCESS_POINTS
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
interface range FastEthernet0/23-24
 description UNUSED_DISABLED_PORTS
 switchport mode access
 switchport access vlan 999
 shutdown
interface Vlan99
 ip address 10.10.99.21 255.255.255.0
 no shutdown
ip default-gateway 10.10.99.1
end
write memory
