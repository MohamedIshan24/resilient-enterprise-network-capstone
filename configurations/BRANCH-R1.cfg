enable
configure terminal
hostname BRANCH-R1
no ip domain-lookup
ipv6 unicast-routing
interface GigabitEthernet0/0
 description BRANCH_802.1Q_TRUNK
 no shutdown
interface GigabitEthernet0/0.110
 description BRANCH_USERS_GATEWAY
 encapsulation dot1Q 110
 ip address 10.20.10.1 255.255.255.0
 ip helper-address 10.10.50.10
 ipv6 address 2001:DB8:20:10::1/64
 ipv6 ospf 10 area 10
interface GigabitEthernet0/0.120
 description BRANCH_SERVICES_GATEWAY
 encapsulation dot1Q 120
 ip address 10.20.20.1 255.255.255.0
 ipv6 address 2001:DB8:20:20::1/64
 ipv6 ospf 10 area 10
interface GigabitEthernet0/0.199
 description BRANCH_MANAGEMENT_GATEWAY
 encapsulation dot1Q 199
 ip address 10.20.99.1 255.255.255.0
interface GigabitEthernet0/0.999
 encapsulation dot1Q 999 native
 no ip address
interface GigabitEthernet0/1
 description PRIMARY_WAN_TO_HQ-EDGE-R1
 ip address 10.255.0.2 255.255.255.252
 ip ospf cost 10
 ip ospf network point-to-point
 ipv6 address 2001:DB8:0:1::2/64
 ipv6 ospf 10 area 0
 no shutdown
interface GigabitEthernet0/2
 description SECONDARY_WAN_TO_HQ-EDGE-R2
 ip address 10.255.0.6 255.255.255.252
 ip ospf cost 50
 ip ospf network point-to-point
 no shutdown
router ospf 10
 router-id 3.3.3.3
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.20.0.0 0.0.255.255 area 10
 area 10 range 10.20.0.0 255.255.0.0
ipv6 router ospf 10
 router-id 3.3.3.3
ntp server 10.10.50.10
logging host 10.10.50.10
snmp-server community NETOPS-RO RO
end
write memory
