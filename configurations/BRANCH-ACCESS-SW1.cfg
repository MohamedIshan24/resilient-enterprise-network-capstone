enable
configure terminal
hostname BRANCH-ACCESS-SW1
spanning-tree mode rapid-pvst
vlan 110
 name BRANCH_USERS
vlan 120
 name BRANCH_SERVICES
vlan 199
 name BRANCH_MANAGEMENT
vlan 999
 name NATIVE_PARKING
ip dhcp snooping
ip dhcp snooping vlan 110
interface GigabitEthernet0/1
 description TRUSTED_TRUNK_TO_BRANCH-R1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 110,120,199,999
 switchport mode trunk
 ip dhcp snooping trust
interface range FastEthernet0/1-18
 description BRANCH_USER_ENDPOINTS
 switchport mode access
 switchport access vlan 110
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
interface range FastEthernet0/19-20
 description BRANCH_SERVICE_ENDPOINTS
 switchport mode access
 switchport access vlan 120
 spanning-tree portfast
interface range FastEthernet0/21-24
 description UNUSED_DISABLED_PORTS
 switchport mode access
 switchport access vlan 999
 shutdown
interface Vlan199
 ip address 10.20.99.11 255.255.255.0
 no shutdown
ip default-gateway 10.20.99.1
end
write memory
