enable
configure terminal
hostname HQ-EDGE-R1
no ip domain-lookup
ip routing
ipv6 unicast-routing
interface GigabitEthernet0/0
 description 802.1Q_TRUNK_TO_HQ-CORE-SW1
 no shutdown
interface GigabitEthernet0/0.10
 description ADMINISTRATION_PRIMARY_GATEWAY
 encapsulation dot1Q 10
 ip address 10.10.10.2 255.255.255.0
 standby 10 ip 10.10.10.1
 standby 10 priority 120
 standby 10 preempt
 ip helper-address 10.10.50.10
 ipv6 address 2001:DB8:10:10::2/64
 ipv6 ospf 10 area 0
interface GigabitEthernet0/0.20
 description ENGINEERING_PRIMARY_GATEWAY
 encapsulation dot1Q 20
 ip address 10.10.20.2 255.255.255.0
 standby 20 ip 10.10.20.1
 standby 20 priority 120
 standby 20 preempt
 ip helper-address 10.10.50.10
 ipv6 address 2001:DB8:10:20::2/64
 ipv6 ospf 10 area 0
interface GigabitEthernet0/0.30
 description FINANCE_PRIMARY_GATEWAY
 encapsulation dot1Q 30
 ip address 10.10.30.2 255.255.255.0
 standby 30 ip 10.10.30.1
 standby 30 priority 120
 standby 30 preempt
 ip helper-address 10.10.50.10
 ipv6 address 2001:DB8:10:30::2/64
 ipv6 ospf 10 area 0
interface GigabitEthernet0/0.40
 description VOICE_PRIMARY_GATEWAY
 encapsulation dot1Q 40
 ip address 10.10.40.2 255.255.255.0
 standby 40 ip 10.10.40.1
 standby 40 priority 120
 standby 40 preempt
 ip helper-address 10.10.50.10
interface GigabitEthernet0/0.50
 description SERVER_FARM_PRIMARY_GATEWAY
 encapsulation dot1Q 50
 ip address 10.10.50.2 255.255.255.0
 standby 50 ip 10.10.50.1
 standby 50 priority 120
 standby 50 preempt
interface GigabitEthernet0/0.60
 description GUEST_PRIMARY_GATEWAY
 encapsulation dot1Q 60
 ip address 10.10.60.2 255.255.255.0
 standby 60 ip 10.10.60.1
 standby 60 priority 120
 standby 60 preempt
 ip helper-address 10.10.50.10
 ip access-group GUEST-INTERNET-ONLY in
interface GigabitEthernet0/0.99
 description NETWORK_MANAGEMENT_PRIMARY_GATEWAY
 encapsulation dot1Q 99
 ip address 10.10.99.2 255.255.255.0
 standby 99 ip 10.10.99.1
 standby 99 priority 120
 standby 99 preempt
interface GigabitEthernet0/0.999
 description UNUSED_NATIVE_VLAN
 encapsulation dot1Q 999 native
 no ip address
interface GigabitEthernet0/1
 description PRIMARY_WAN_TO_BRANCH-R1
 ip address 10.255.0.1 255.255.255.252
 ip ospf network point-to-point
 ip nat inside
 ipv6 address 2001:DB8:0:1::1/64
 ipv6 ospf 10 area 0
 no shutdown
interface GigabitEthernet0/2
 description INTERNET_UPLINK_TO_ISP-R1
 ip address 198.51.100.2 255.255.255.252
 ip nat outside
 no shutdown
ip access-list extended GUEST-INTERNET-ONLY
 deny ip 10.10.60.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 10.10.60.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny ip 10.10.60.0 0.0.0.255 192.168.0.0 0.0.255.255
 permit ip 10.10.60.0 0.0.0.255 any
ip access-list standard NAT-INSIDE-NETWORKS
 permit 10.10.0.0 0.0.255.255
 permit 10.20.0.0 0.0.255.255
ip nat inside source list NAT-INSIDE-NETWORKS interface GigabitEthernet0/2 overload
ip route 0.0.0.0 0.0.0.0 198.51.100.1 10
router ospf 10
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.10.0.0 0.0.255.255 area 0
 network 10.255.0.0 0.0.0.3 area 0
 default-information originate
ipv6 router ospf 10
 router-id 1.1.1.1
ntp server 10.10.50.10
logging host 10.10.50.10
snmp-server community NETOPS-RO RO
end
write memory
