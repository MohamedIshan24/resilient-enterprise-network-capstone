enable
configure terminal
hostname HQ-CORE-SW1
spanning-tree mode rapid-pvst
vlan 10
 name ADMINISTRATION
vlan 20
 name ENGINEERING
vlan 30
 name FINANCE
vlan 40
 name VOICE
vlan 50
 name SERVER_FARM
vlan 60
 name GUEST_WIFI
vlan 99
 name NETWORK_MANAGEMENT
vlan 999
 name NATIVE_PARKING
interface GigabitEthernet0/1
 description TRUNK_TO_HQ-EDGE-R1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,99,999
 switchport mode trunk
interface range FastEthernet0/23-24
 description LACP_ETHERCHANNEL_TO_HQ-CORE-SW2
 channel-group 1 mode active
interface Port-channel1
 description REDUNDANT_CORE_INTERCONNECT
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,99,999
 switchport mode trunk
interface GigabitEthernet0/2
 description TRUNK_TO_HQ-ACCESS-SW1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,99,999
 switchport mode trunk
spanning-tree vlan 10,20,50,99 root primary
spanning-tree vlan 30,40,60 root secondary
interface Vlan99
 ip address 10.10.99.11 255.255.255.0
 no shutdown
ip default-gateway 10.10.99.1
end
write memory
